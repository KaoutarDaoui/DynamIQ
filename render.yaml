# Free architecture: 4 web APIs here on Render's free plan (cold-starts
# after ~15min idle, but $0). The 2 processes that used to run as perpetual
# Render background workers (no free plan for those) now run as GitHub
# Actions scheduled workflows instead -- see .github/workflows/
# simulate-sensors.yml and orchestration-loop.yml. That trades the tight
# 2-minute cadence for a looser ~5-minute one; see those files for why.

envVarGroups:
  - name: dynamiq-db
    envVars:
      - key: DATABASE_URL
        sync: false

  - name: dynamiq-groq
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DIAGNOSTIC_GROQ_API_KEY
        sync: false
      - key: GROQ_DIAGNOSTIC_MODEL
        value: qwen/qwen3.6-27b
      - key: GROQ_VISION_MODEL
        sync: false

  - name: dynamiq-supabase
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  - name: dynamiq-alerts
    envVars:
      - key: SUPERVISOR_ALERT_EMAILJS_SERVICE_ID
        sync: false
      - key: SUPERVISOR_ALERT_EMAILJS_TEMPLATE_ID
        sync: false
      - key: SUPERVISOR_ALERT_EMAILJS_PUBLIC_KEY
        sync: false
      - key: SUPERVISOR_ALERT_EMAILJS_PRIVATE_KEY
        sync: false
      - key: SUPERVISOR_ALERT_EMAILJS_TO
        sync: false

services:
  # --- HTTP APIs (the frontend calls these three directly) ---
  - type: web
    name: dynamiq-building-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agents.building_agent.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: dynamiq-db
      - fromGroup: dynamiq-groq
      - fromGroup: dynamiq-supabase
      # Comma-separated list, e.g. https://your-app.vercel.app -- set this
      # once you know the Vercel URL (see deploy notes).
      - key: BUILDING_API_CORS_ORIGINS
        sync: false

  - type: web
    name: dynamiq-thermal-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agents.thermal_agent.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: dynamiq-db
      - key: THERMAL_API_CORS_ORIGINS
        sync: false

  - type: web
    name: dynamiq-diagnostic-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agents.diagnostic_agent.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: dynamiq-db
      - fromGroup: dynamiq-groq
      - key: DIAGNOSTIC_API_CORS_ORIGINS
        sync: false

  # --- Orchestration API: GitHub Actions is the real cycle driver now (see
  # top of file), but this stays deployed since POST /run-cycle is still
  # useful for a manual/on-demand trigger -- hence it still needs the Groq +
  # alerts secrets, same as the workflow that used to be a Render worker. ---
  - type: web
    name: dynamiq-orchestration-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn orchestration.api:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - fromGroup: dynamiq-db
      - fromGroup: dynamiq-groq
      - fromGroup: dynamiq-alerts
      - key: SUPERVISOR_API_CORS_ORIGINS
        sync: false
