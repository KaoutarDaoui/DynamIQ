[project]
name = "dynamiq"
version = "0.1.0"
description = "Predictive HVAC control: RC thermal model, MPC optimizer, and a supervised multi-agent diagnostic system"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "anthropic>=0.40",
    "pvlib>=0.11",
    "ecos>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dynamiq*", "agents*", "thermal_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
